<!DOCTYPE html>
<html lang="en">
<head>

    <title>Unit converter</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

        <div id="top">
            <h1>Metric/Imperical Unit Conversion</h1>
            <input type="text" placeholder="0" id="input-el">

        </div>
        <div class="bottom">
            <div class="conversion">
                <h2>Length (Meter/Feat)</h2>
                <p></p>
            </div>
            <div class="conversion">
                <h2>Volume (Liters/Gallons)</h2>
                <p></p>
            </div>
            <div class="conversion">
                <h2>Mass (Kilograms/Pounds)</h2>
                <p></p>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
